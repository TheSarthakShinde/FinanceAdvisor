{% extends "base.html" %}

{% block content %}

<div class="container mt-5" style="max-width: 650px;">

    <h2 class="mb-4">Add Purchase Goal</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn btn-primary">
            Save Goal
        </button>

        <a
            href="{% url 'dashboard' %}"
            class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
