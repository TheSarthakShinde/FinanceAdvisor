{% extends "base.html" %}

{% block content %}

<div class="container mt-5" style="max-width:600px;">

    <h2 class="mb-4">
        Add Expense
    </h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button

            class="btn btn-danger">

            Save Expense

        </button>

    </form>

</div>

{% endblock %}
