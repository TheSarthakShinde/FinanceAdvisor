{% extends "base.html" %}

{% block content %}

<div class="container mt-5" style="max-width:450px;">

    <h2 class="mb-4 text-center">Login</h2>

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">

            <label>Username</label>

            <input
                type="text"
                name="username"
                class="form-control"
                required>

        </div>

        <div class="mb-3">

            <label>Password</label>

            <input
                type="password"
                name="password"
                class="form-control"
                required>

        </div>

        <button class="btn btn-success w-100">
            Login
        </button>

    </form>

    <p class="mt-3 text-center">
        Don't have an account?
        <a href="{% url 'register' %}">
            Register
        </a>
    </p>

</div>

{% endblock %}
